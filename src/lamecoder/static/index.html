<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LameCoder</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preconnect" href="https://esm.sh" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
</head>
<body>
  <div id="app" class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">LameCoder</div>
        <button id="newSessionBtn" class="btn">New</button>
      </div>
      <div id="sessions" class="sessions"></div>
      <div class="sidebar-footer">
        <div id="workspaceInfo" class="muted"></div>
      </div>
    </aside>

    <main class="main">
      <div class="main-status">
        <div id="workspaceBanner" class="workspace-banner muted">workspace: -</div>
        <div class="status-strip" aria-live="polite">
          <span id="thinkingStatus" class="status-pill">Thinking: idle</span>
          <span id="todoStatus" class="status-pill">Todo: 0 open</span>
        </div>
      </div>

      <div id="conversation" class="conversation"></div>

      <div class="composer">
        <div id="editor" class="editor"></div>
        <div class="composer-actions">
          <div class="hint muted">Enter = newline • Ctrl/Cmd+Enter atau tombol Send</div>
          <button id="sendBtn" class="btn primary">Send</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
