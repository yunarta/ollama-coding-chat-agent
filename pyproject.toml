[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lamecoder"
version = "0.1.0"
description = "Local-first coding agent UI with session management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yong"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.scripts]
lamecoder = "lamecoder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lamecoder"]

[tool.hatch.build]
include = [
  "src/lamecoder/static/**",
]
